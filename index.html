<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatrack - Gestión Segura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        /* Pantalla de Login */
        #loginScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #002b5c; display: flex; align-items: center; justify-content: center; z-index: 9999; 
        }
        .login-card { background: white; padding: 2rem; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* App Layout */
        .navbar { background-color: #002b5c; color: white; }
        .hidden { display: none !important; }
        .text-placa { color: #d63384; font-weight: bold; font-family: monospace; }
        .btn-wsp { background-color: #25D366; color: white; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card text-center">
        <img src="https://via.placeholder.com/150x50?text=DATATRACK" class="mb-4" alt="Logo">
        <h4 class="mb-3">Panel de Control</h4>
        <div id="loginForm">
            <input type="email" id="userEmail" class="form-control mb-2" placeholder="Correo Despachador">
            <input type="password" id="userPass" class="form-control mb-3" placeholder="Contraseña">
            <button class="btn btn-primary w-100 mb-2" onclick="login()">Entrar como Despachador</button>
            <hr>
            <button class="btn btn-outline-secondary w-100" onclick="accesoTecnico()">Acceso Visual Técnico</button>
        </div>
    </div>
</div>

<div id="appContent" class="hidden">
    <nav class="navbar p-3 mb-4 d-flex justify-content-between">
        <span class="h5 mb-0">DATATRACK - <span id="txtRol">Rol</span></span>
        <button class="btn btn-sm btn-light" onclick="logout()">Cerrar Sesión</button>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div id="colForm" class="col-xl-4 col-lg-5 mb-4 hidden">
                <div class="card p-4 border-0 shadow-sm">
                    <h5 class="text-primary mb-3 border-bottom pb-2">Nueva Asignación</h5>
                    <form id="formServicio">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="small fw-bold">TÉCNICO</label>
                            <select id="tecnicoSelect" class="form-select" onchange="cargarDatosTecnico()" required>
                                <option value="">Seleccione...</option>
                                <option value="Sebastián León">Sebastián León</option>
                                <option value="Lord Zambrano">Lord Zambrano</option>
                                <option value="Wilton Posso">Wilton Posso</option>
                                <option value="Orlando Lara">Orlando Lara</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-8">
                                <label class="small fw-bold">CLIENTE</label>
                                <input type="text" id="cliente" class="form-control" required>
                            </div>
                            <div class="col-4">
                                <label class="small fw-bold">CANT.</label>
                                <input type="number" id="cantPlacas" class="form-control" value="1" min="1" oninput="generarCamposPlacas()">
                            </div>
                        </div>
                        <div id="contenedorPlacas" class="row gx-2 mb-3"></div>
                        <button type="submit" class="btn btn-primary w-100">GUARDAR ASIGNACIÓN</button>
                    </form>
                </div>
            </div>

            <div id="colTabla" class="col-12">
                <div class="card p-4 border-0 shadow-sm">
                    <div class="d-flex justify-content-between mb-3">
                        <h6>Agenda Nacional</h6>
                        <input type="text" id="filtroTexto" class="form-control form-control-sm w-50" placeholder="Filtrar..." onkeyup="renderizarTabla()">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Técnico</th>
                                    <th>Servicio / Placas</th>
                                    <th>Horario</th>
                                    <th class="text-center colAcciones hidden">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaServicios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>v

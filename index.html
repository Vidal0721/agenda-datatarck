<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatrack - Control Operativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { background-color: #001a35; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-card { background: #e9ecef; padding: 2rem; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo-container { background: #ced4da; border-radius: 15px; padding: 15px; margin-bottom: 20px; display: inline-block; }
        .hidden { display: none !important; }
        .navbar { background: #002b5c; color: white; }
        .text-placa { color: #d63384; font-weight: bold; }
        .solo-admin { display: table-cell; }
        .modo-tecnico .solo-admin { display: none !important; }
    </style>
</head>
<body id="mainBody">

<div id="loginScreen">
    <div class="login-card text-center">
        <div class="logo-container">
            <i class="bi bi-truck-flatbed" style="font-size: 3rem; color: #002b5c;"></i>
        </div>
        <h4 class="fw-bold mb-4" style="color: #002b5c;">Control Operativo</h4>
        <input type="email" id="userEmail" class="form-control mb-2" placeholder="Correo Despachador">
        <input type="password" id="userPass" class="form-control mb-3" placeholder="Contraseña">
        <button class="btn btn-primary w-100 mb-3 fw-bold" onclick="login()">INGRESAR AL PANEL</button>
        <div class="text-muted small mb-3">O ACCESO DE CAMPO</div>
        <button class="btn btn-outline-secondary w-100 fw-bold" onclick="accesoTecnico()">ACCESO TÉCNICO (SÓLO LECTURA)</button>
    </div>
</div>

<div id="appContent" class="hidden">
    <nav class="navbar p-3 d-flex justify-content-between align-items-center">
        <span class="fw-bold">DATATRACK | <small id="txtRol"></small></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar Sesión</button>
    </nav>
    
    <div class="container-fluid mt-4 px-4 text-white">
        <div class="row">
            <div id="panelForm" class="col-md-4 mb-4">
                <div class="card p-3 text-dark">
                    <h5 class="text-primary border-bottom pb-2">Asignar Servicio</h5>
                    <form id="formServicio">
                        <label class="small fw-bold">Técnico</label>
                        <select id="tecnicoSelect" class="form-select mb-2" required>
                            <option value="Lord Zambrano">Lord Zambrano</option>
                            <option value="Orlando Lara">Orlando Lara</option>
                            <option value="Sebastián León">Sebastián León</option>
                            <option value="Wilton Posso">Wilton Posso</option>
                        </select>
                        <label class="small fw-bold">Placa</label>
                        <input type="text" id="placa" class="form-control mb-2" placeholder="ABC-123" required>
                        <label class="small fw-bold">Inicio</label>
                        <input type="datetime-local" id="inicio" class="form-control mb-3" required>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">GUARDAR</button>
                    </form>
                </div>
            </div>
            <div id="panelTabla" class="col-md-8">
                <div class="card p-3 text-dark">
                    <h6 class="fw-bold">Agenda Nacional</h6>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Técnico</th>
                                    <th>Placa</th>
                                    <th>Fecha</th>
                                    <th class="solo-admin">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaServicios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

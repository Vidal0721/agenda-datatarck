<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatrack - Control Operativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root { --dt-blue: #002b5c; --dt-dark: #001a35; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        #loginScreen { position: fixed; inset: 0; background: var(--dt-dark); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { background: white; padding: 2rem; border-radius: 20px; width: 100%; max-width: 380px; }
        .navbar { background: var(--dt-blue); color: white; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        .form-label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #666; margin-bottom: 2px; }
        .text-placa { background: #fff3cd; color: #856404; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: bold; border: 1px solid #ffeeba; }
        .modo-tecnico .solo-admin { display: none !important; }
        .alert-solapamiento { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 8px; font-size: 0.8rem; margin-top: 10px; border: 1px solid #f5c6cb; }
    </style>
</head>
<body id="mainBody">

<div id="loginScreen">
    <div class="login-card text-center shadow-lg">
        <i class="bi bi-shield-check text-primary" style="font-size: 3rem;"></i>
        <h4 class="fw-bold mt-2">DATATRACK</h4>
        <input type="email" id="userEmail" class="form-control mb-2" placeholder="usuario@datatrack.co">
        <input type="password" id="userPass" class="form-control mb-3" placeholder="Contraseña">
        <button class="btn btn-primary w-100 mb-3 fw-bold" onclick="login()">INGRESAR</button>
        <button class="btn btn-outline-secondary btn-sm w-100" onclick="accesoTecnico()">VISTA RÁPIDA</button>
    </div>
</div>

<div id="appContent" class="hidden">
    <nav class="navbar px-4 py-2 d-flex justify-content-between">
        <span class="fw-bold">AGENDA DATATRACK</span>
        <div class="d-flex align-items-center gap-3">
            <small id="txtRol" class="badge bg-info text-dark"></small>
            <button class="btn btn-sm btn-light" onclick="logout()"><i class="bi bi-power"></i></button>
        </div>
    </nav>
    
    <div class="container-fluid p-4">
        <div class="row">
            <div id="colForm" class="col-xl-4 col-lg-5 mb-4 solo-admin">
                <div class="card p-4">
                    <h6 class="fw-bold text-primary mb-3 border-bottom pb-2">NUEVA ASIGNACIÓN</h6>
                    <form id="formServicio" class="row g-2">
                        <input type="hidden" id="editId">
                        
                        <div class="col-6">
                            <label class="form-label">Técnico</label>
                            <select id="tecnico" class="form-select form-select-sm" onchange="seleccionarTecnico(this.value)" required>
                                <option value="">Seleccione...</option>
                                <option value="Sebastián León">Sebastián León</option>
                                <option value="Orlando Lara">Orlando Lara</option>
                                <option value="Lord Zambrano">Lord Zambrano</option>
                                <option value="OTRO">-- OTRO --</option>
                            </select>
                        </div>
                        <div id="divOtro" class="col-6 hidden">
                            <label class="form-label text-danger">Nombre Externo</label>
                            <input type="text" id="otroNombre" class="form-control form-control-sm border-danger">
                        </div>

                        <div class="col-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" id="telTec" class="form-control form-control-sm" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Email</label>
                            <input type="email" id="emailTec" class="form-control form-control-sm" readonly>
                        </div>

                        <div class="col-12"><label class="form-label">Cliente</label><input type="text" id="cliente" class="form-control form-control-sm" required></div>
                        <div class="col-12"><label class="form-label">Dirección</label><input type="text" id="direccion" class="form-control form-control-sm"></div>

                        <div class="col-6">
                            <label class="form-label">Hora Inicio</label>
                            <input type="datetime-local" id="fechaInicio" class="form-control form-control-sm" required onchange="validarSolapamiento()">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Hora Fin (Estimada)</label>
                            <input type="datetime-local" id="fechaFin" class="form-control form-control-sm" required onchange="validarSolapamiento()">
                        </div>

                        <div id="alertaCruce" class="col-12 hidden">
                            <div class="alert-solapamiento"><i class="bi bi-exclamation-triangle"></i> ¡ATENCIÓN! El técnico ya tiene un servicio en este horario.</div>
                        </div>

                        <div class="col-4">
                            <label class="form-label">Placas</label>
                            <input type="number" id="cantPlacas" class="form-control form-control-sm" value="1" min="1" onchange="generarInputsPlacas(this.value)">
                        </div>
                        <div class="col-8">
                            <div id="contenedorPlacas" class="mt-3 d-flex flex-wrap gap-1">
                                <input type="text" class="form-control form-control-sm input-placa" placeholder="Placa 1" style="width: 100px;">
                            </div>
                        </div>

                        <div class="col-12 mt-3">
                            <button type="submit" id="btnGuardar" class="btn btn-primary w-100 fw-bold">GUARDAR ASIGNACIÓN</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="colTabla" class="col-xl-8 col-lg-7">
                <div class="card p-4">
                    <div class="d-flex justify-content-between mb-3">
                        <button class="btn btn-white border btn-sm" onclick="renderizarTabla()">Actualizar <i class="bi bi-arrow-clockwise"></i></button>
                        <button class="btn btn-success btn-sm solo-admin" onclick="exportarExcel()">Excel</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle border">
                            <thead>
                                <tr class="small text-center">
                                    <th>Técnico / Cliente</th>
                                    <th>Placas</th>
                                    <th>Horario</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaServicios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalVer" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body p-4" id="detalleContenido"></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="script.js"></script>
</body>
</html>

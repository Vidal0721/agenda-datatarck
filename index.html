<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatrack - Operaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        #loginScreen { position: fixed; inset: 0; background: #001a35; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { background: white; padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        .navbar { background: #002b5c; color: white; }
        .card { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: #64748b; margin-bottom: 2px; }
        .text-placa { color: #d63384; font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        .modo-tecnico .solo-admin { display: none !important; }
    </style>
</head>
<body id="mainBody">

<div id="loginScreen">
    <div class="login-card text-center shadow-lg">
        <i class="bi bi-truck-flatbed text-primary" style="font-size: 3.5rem;"></i>
        <h4 class="fw-bold mt-3 mb-4">Datatrack Control</h4>
        <input type="email" id="userEmail" class="form-control mb-2" placeholder="Correo corporativo">
        <input type="password" id="userPass" class="form-control mb-3" placeholder="Contraseña">
        <button class="btn btn-primary w-100 mb-3 py-2 fw-bold" onclick="login()">Entrar</button>
        <button class="btn btn-outline-secondary w-100" onclick="accesoTecnico()">Solo Lectura</button>
    </div>
</div>

<div id="appContent" class="hidden">
    <nav class="navbar p-3 d-flex justify-content-between align-items-center mb-4">
        <span class="fw-bold">DATATRACK | <small id="txtRol" class="text-info"></small></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Salir</button>
    </nav>
    
    <div class="container-fluid px-4">
        <div class="row">
            <div id="colForm" class="col-xl-4 col-lg-5 mb-4 solo-admin">
                <div class="card p-4">
                    <h5 class="text-primary mb-3 border-bottom pb-2">Asignación</h5>
                    <form id="formServicio" class="row g-2">
                        <input type="hidden" id="editId">
                        <div class="col-6">
                            <label class="form-label">Asignado Por</label>
                            <select id="asignadoPor" class="form-select form-select-sm">
                                <option value="Vidal Zambrano">Vidal Zambrano</option>
                                <option value="Deivis Palencia">Deivis Palencia</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Técnico</label>
                            <select id="tecnico" class="form-select form-select-sm" onchange="checkOtroTecnico(this.value)">
                                <option value="Sebastián León">Sebastián León</option>
                                <option value="Lord Zambrano">Lord Zambrano</option>
                                <option value="Wilton Posso">Wilton Posso</option>
                                <option value="Orlando Lara">Orlando Lara</option>
                                <option value="Nilson Payares">Nilson Payares</option>
                                <option value="OTRO">-- OTRO --</option>
                            </select>
                        </div>
                        <div id="divOtroTecnico" class="col-12 hidden">
                            <label class="form-label text-danger">Escriba el nombre del técnico</label>
                            <input type="text" id="otroTecnicoNombre" class="form-control form-control-sm border-danger">
                        </div>

                        <div class="col-6">
                            <label class="form-label">WhatsApp</label>
                            <input type="text" id="wsp" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Email Notif.</label>
                            <input type="email" id="emailNotif" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Ciudad</label>
                            <input type="text" id="ciudad" class="form-control form-control-sm">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Dirección</label>
                            <input type="text" id="direccion" class="form-control form-control-sm">
                        </div>
                        <div class="col-8">
                            <label class="form-label">Cliente</label>
                            <input type="text" id="cliente" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label">Placas</label>
                            <input type="number" id="cantPlacas" class="form-control form-control-sm" value="1">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Vehículo / Placas</label>
                            <input type="text" id="placas" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Observaciones</label>
                            <textarea id="obs" class="form-control form-control-sm" rows="2"></textarea>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Inicio</label>
                            <input type="datetime-local" id="inicio" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-6 mt-4">
                            <button type="submit" id="btnGuardar" class="btn btn-primary w-100 fw-bold">GUARDAR</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="colTabla" class="col-xl-8 col-lg-7">
                <div class="card p-4">
                    <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar..." onkeyup="renderizarTabla()">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark text-center">
                                <tr class="small">
                                    <th>Técnico</th>
                                    <th>Vehículo</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaServicios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalVer" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white p-2">
                <h6 class="modal-title">Detalles</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="detalleContenido"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
